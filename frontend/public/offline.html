<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Animal Guardian 360°</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: #dc2626;
      color: white;
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
      border-radius: 9999px;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      margin: 0 0 8px 0;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .emergency-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
    }
    .emergency-title {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 800;
      color: #10b981;
      margin-bottom: 8px;
    }
    .helpline-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      padding: 10px 0;
      border-bottom: 1px solid #1e293b;
    }
    .helpline-link:last-child {
      border-bottom: none;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background: #059669;
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-sizing: border-box;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Offline Emergency Mode</div>
    <h1>You are currently offline</h1>
    <p>No active internet connection was detected. You can still reach national emergency helplines directly:</p>

    <div class="emergency-box">
      <div class="emergency-title">Immediate Voice Helplines</div>
      <a href="tel:112" class="helpline-link">
        <span>Police & Medical SOS</span>
        <span style="color: #ef4444;">112</span>
      </a>
      <a href="tel:1962" class="helpline-link">
        <span>National Animal Helpline</span>
        <span style="color: #10b981;">1962</span>
      </a>
      <a href="tel:1800119966" class="helpline-link">
        <span>Animal Welfare Board (AWBI)</span>
        <span style="color: #38bdf8;">Toll-Free</span>
      </a>
    </div>

    <button onclick="window.location.reload()" class="btn">Retry Network Connection</button>
  </div>
</body>
</html>
