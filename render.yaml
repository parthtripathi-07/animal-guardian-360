services:
  - type: web
    name: animal-guardian-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: animal-guardian-db
          property: connectionString
      - key: MOCK_OTP_MODE
        value: true

databases:
  - name: animal-guardian-db
    databaseName: animal_guardian_db
    user: postgres
    plan: free
